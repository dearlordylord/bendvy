name: Infrastructure checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check committed sources and whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/check-python-source.py --diff-base "$DIFF_BASE" --diff-head "$DIFF_HEAD" --merge-base
          else
            python3 scripts/check-python-source.py --diff-base "$DIFF_BASE" --diff-head "$DIFF_HEAD"
          fi
      - name: Runner, logs, tool pins and statistics
        run: |
          python3 scripts/test-task-runner.py
          python3 scripts/test-evidence-boundary.py
          python3 scripts/test-receipt-logs.py
          python3 scripts/test-owned-tool-pins.py
          python3 scripts/test-check-preflight.py
          python3 scripts/test-staged-bend-imports.py
          python3 scripts/test-selected-reference.py
          python3 benchmarks/test-statistics.py
          python3 scripts/test-retro-controls.py
          python3 scripts/test-pre-commit.py
          python3 scripts/test-retro-v1plus1.py
