name: Infrastructure checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check committed sources and whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$DIFF_BASE" ] && [ "$DIFF_BASE" != 0000000000000000000000000000000000000000 ]; then
            if ! git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$DIFF_BASE"
            fi
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/check-python-source.py --diff-base "$DIFF_BASE" --diff-head "$DIFF_HEAD" --merge-base
          else
            python3 scripts/check-python-source.py --diff-base "$DIFF_BASE" --diff-head "$DIFF_HEAD"
          fi
      - name: Runner, logs, tool pins and statistics
        run: |
          python3 scripts/check-experiment-state.py
          python3 scripts/test-experiment-state.py
          python3 scripts/test-task-runner.py
          python3 scripts/test-evidence-boundary.py
          python3 scripts/test-receipt-logs.py
          python3 scripts/test-owned-tool-pins.py
          python3 scripts/test-check-preflight.py
          python3 scripts/test-staged-bend-imports.py
          python3 scripts/test-selected-reference.py
          python3 benchmarks/test-statistics.py
          python3 scripts/test-retro-controls.py
          python3 scripts/test-pre-commit.py
          python3 scripts/test-retro-v1plus1.py

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install pinned Bend 2.0.37
        shell: bash
        run: |
          archive="$RUNNER_TEMP/bend-2.0.37-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/bendlang/bend/releases/download/v2.0.37/bend-2.0.37-linux-x64.tar.gz \
            -o "$archive"
          echo "84c32465a39bc9ac315eade23f470cb8db03153dc860f89564fcfec153c3e445  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "BEND=$RUNNER_TEMP/bend/bin/bend" >> "$GITHUB_ENV"
          echo 'BEND_NO_TELEMETRY=1' >> "$GITHUB_ENV"
      - name: Install Native compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19
          echo 'CLANG=clang-19' >> "$GITHUB_ENV"
      - name: Compile and exercise every runnable example
        env:
          BENDVY_EXAMPLE_NATIVE: '1'
        run: bash examples/check.sh
